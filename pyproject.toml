[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "offline-it-helpdesk"
version = "0.1.0"
description = "A 100% local IT helpdesk assistant: hybrid RAG over runbooks with ONNX embeddings, a small local LLM (llama.cpp / Ollama), cited answers, FastAPI + web UI, and an evaluation suite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesús Aragón" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "helpdesk", "onnx", "llama.cpp", "ollama", "on-device-ai", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# onnxruntime is not a hard dependency so Termux / QNN / GPU builds can be used instead.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
qnn = ["onnxruntime-qnn>=1.18"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "tokenizers>=0.15",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
helpdesk = "offline_helpdesk.cli:main"

[project.urls]
Homepage = "https://github.com/RobiiAragon/offline-it-helpdesk"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_helpdesk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is kept verbatim; re-wrapping it changes model behaviour.
"src/offline_helpdesk/rag.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
