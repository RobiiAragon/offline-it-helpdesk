name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (hashing embedder + fake LLM, no downloads)
        run: pytest -q
      - name: Retrieval eval with the real ONNX embedder (23 MB, no LLM)
        run: |
          helpdesk download
          helpdesk index
          helpdesk eval --llm extractive --out ci-eval.json
          python - <<'PY'
          import json
          s = json.load(open("ci-eval.json"))["summary"]
          assert s["retrieval_hit@k"] >= 0.95, s
          assert s["oos_refusal_rate"] >= 0.85, s
          print("retrieval gate passed")
          PY
