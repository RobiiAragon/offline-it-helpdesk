name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (hashing embedder + fake LLM, no downloads)
        run: pytest -q
      - name: Retrieval eval with the real ONNX embedder (23 MB, no LLM)
        run: |
          helpdesk download
          helpdesk index
          helpdesk eval --llm extractive --out ci-eval.json
          python - <<'PY'
          import json
          s = json.load(open("ci-eval.json"))["summary"]
          assert s["retrieval_hit@k"] >= 0.95, s
          assert s["oos_refusal_rate"] >= 0.85, s
          print("retrieval gate passed")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t offline-it-helpdesk .
      - name: Smoke test the container (published port)
        run: |
          docker run -d --name hd-net -p 127.0.0.1:8000:8000 offline-it-helpdesk
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          echo
          curl -sf -X POST http://127.0.0.1:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"How long are print jobs kept?"}' > ask.json
          python3 -c "import json; a=json.load(open('ask.json')); print(a['answer']); assert not a['refused'] and a['citations'], a"
      - name: Smoke test with networking disabled (fully offline)
        run: |
          docker run -d --name hd-offline --network none offline-it-helpdesk
          cat > probe.py <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          req = urllib.request.Request(
              "http://127.0.0.1:8000/ask",
              data=json.dumps({"question": "How do I reset my password?"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          a = json.load(urllib.request.urlopen(req, timeout=10))
          print(a["answer"][:160])
          assert not a["refused"], a
          PY
          docker cp probe.py hd-offline:/tmp/probe.py
          docker exec hd-offline python /tmp/probe.py
      - name: Container logs
        if: always()
        run: docker logs hd-net; docker logs hd-offline || true
